name: Python Tests

on:
  push:
    branches: ["main", "claude/**", "feature/**"]
    paths:
      - "context_harness/**"
      - "tests/**"
      - "data/**"
      - "evals/**"
      - "pytest.ini"
      - "requirements.txt"
      - ".github/workflows/python-tests.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "context_harness/**"
      - "tests/**"
      - "data/**"
      - "evals/**"
      - "pytest.ini"
      - "requirements.txt"

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ matrix.python-version }}-

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: |
            .pytest_cache/
          retention-days: 7

  dspy-eval:
    name: DSPy EVALSET SLO check
    runs-on: ubuntu-latest
    # Opt-in gate. GitHub forbids `secrets.*` in job-level `if:` expressions
    # (only `vars.*` is permitted), so the maintainer must set a repo
    # variable `GEMINI_API_KEY` to any non-empty value to enable this job,
    # in addition to the secret with the same name used at step runtime.
    # External contributor forks won't have either set, so the job is skipped.
    if: ${{ vars.GEMINI_API_KEY != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-eval-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-eval-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ingest lore into ChromaDB
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m context_harness.ingest_lore

      - name: Run SLO check (deep_research ≥80%, debate ≥60%)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m evals.slo_check --all-modes --verbose
