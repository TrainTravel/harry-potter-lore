name: Python Tests

on:
  push:
    branches: ["main", "claude/**", "feature/**"]
    paths:
      - "context_harness/**"
      - "tests/**"
      - "pytest.ini"
      - "requirements.txt"
      - ".github/workflows/python-tests.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "context_harness/**"
      - "tests/**"
      - "pytest.ini"
      - "requirements.txt"

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ matrix.python-version }}-

      # Cache the chromadb ONNX embedding model (~25 MB download on first use).
      # Keyed on the chromadb version so a version bump invalidates the cache.
      - name: Cache chromadb ONNX model
        uses: actions/cache@v4
        with:
          path: ~/.cache/chroma
          key: chroma-model-${{ hashFiles('requirements.txt') }}

      # Install the full requirements.txt — all packages have pre-built binary
      # wheels for ubuntu-latest (onnxruntime, chroma-hnswlib, etc.) and the
      # pip cache makes subsequent runs fast.
      # pytest and pytest-asyncio are not in requirements.txt, so install them
      # alongside.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: |
            .pytest_cache/
          retention-days: 7
