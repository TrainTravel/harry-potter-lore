name: Python Tests

on:
  push:
    branches: ["main", "claude/**", "feature/**"]
    paths:
      - "context_harness/**"
      - "tests/**"
      - "pytest.ini"
      - "requirements.txt"
      - ".github/workflows/python-tests.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "context_harness/**"
      - "tests/**"
      - "pytest.ini"
      - "requirements.txt"

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ matrix.python-version }}-

      # chromadb is required: tests/test_chromadb_integration.py runs a real
      # ingest→embed→retrieve path against an EphemeralClient, and several
      # other tests instantiate RAGPipeline which imports chromadb at init.
      # onnxruntime ships with chromadb and powers DefaultEmbeddingFunction
      # (no torch required — matches the Intel-Mac ONNX fallback path).
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio chromadb==0.5.23

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: |
            .pytest_cache/
          retention-days: 7
