name: DSPy Eval Comparison

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of questions (blank for all)"
        required: false
        default: ""

jobs:
  eval:
    name: Compiled vs Uncompiled
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-eval-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Seed ChromaDB
        run: python -m context_harness.ingest_lore

      - name: Compile DSPy agent
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python -m context_harness.compile_agent \
            --model gemini/gemini-2.5-flash-lite \
            --out my_profile.agent

      - name: Run comparison
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          LIMIT="${{ github.event.inputs.limit }}"
          if [ -n "$LIMIT" ]; then
            ./evals/compare_dspy.sh "$LIMIT"
          else
            ./evals/compare_dspy.sh
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dspy-eval-results
          path: evals/results_dspy_*.json
          retention-days: 30
