name: CI

# Single status check that GitHub branch protection rules can gate on.
# Reports green only when BOTH Python and Scala tests pass.

on:
  push:
    branches: ["main", "claude/**", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Python ────────────────────────────────────────────────────────────────
  python:
    name: pytest / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ matrix.python-version }}-

      - name: Install test dependencies
        run: pip install pytest pytest-asyncio

      - name: Run pytest
        run: python -m pytest tests/ -v --tb=short

  # ── Scala ─────────────────────────────────────────────────────────────────
  scala:
    name: sbt test / Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Cache sbt + Coursier
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.cache/coursier
            scala-harness/target
            scala-harness/project/target
          key: sbt-${{ matrix.java }}-${{ hashFiles('scala-harness/build.sbt', 'scala-harness/project/plugins.sbt') }}
          restore-keys: sbt-${{ matrix.java }}-

      - name: Install sbt
        run: |
          curl -fL "https://github.com/sbt/sbt/releases/download/v1.10.6/sbt-1.10.6.tgz" | tar xz -C /usr/local
          echo "/usr/local/sbt/bin" >> $GITHUB_PATH

      - name: Run sbt test
        working-directory: scala-harness
        run: sbt "testOnly *Suite" --batch
        env:
          SBT_OPTS: "-Xmx2G -Xss4M"

  # ── Gate ──────────────────────────────────────────────────────────────────
  # A single job that branch protection can require. Succeeds only when all
  # matrix jobs above pass. This avoids having to add every matrix cell
  # individually to the branch protection required-status list.
  all-tests-pass:
    name: All tests pass
    runs-on: ubuntu-latest
    needs: [python, scala]
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.python.result }}" != "success" || "${{ needs.scala.result }}" != "success" ]]; then
            echo "One or more test jobs failed."
            exit 1
          fi
          echo "All test jobs passed."
