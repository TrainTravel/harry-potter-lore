name: UI Critique (weekly)

# Drives the live Lovable UI through scripted journeys, captures screenshots,
# and asks Gemini 2.5 Pro to critique them. Outputs the critique +
# screenshots as a CI artifact.
#
# Cost: ~$0.05-0.10 per run (Gemini 2.5 Pro, 4 screenshots).
# Frequency: weekly Sunday 09:00 UTC = once per week, ~$3-5/year.
# Manual trigger: workflow_dispatch from the Actions tab.
#
# Required secret:
#   GOOGLE_API_KEY — for the critique call. Same key the lore agent uses
#   at runtime, so no separate billing relationship to manage. Set via
#   repo Settings → Secrets and variables → Actions.

on:
  schedule:
    # Sunday 09:00 UTC ≈ Sunday 02:00 PT / 17:00 China time
    - cron: "0 9 * * 0"
  workflow_dispatch: {}

jobs:
  critique:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install e2e deps
        working-directory: e2e
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run exploration (screenshots)
        working-directory: e2e
        env:
          FRONTEND_URL: https://lore-whisperer-ui.lovable.app
        run: npm run ui-critique:explore

      - name: Run critique (Gemini API)
        working-directory: e2e
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          CRITIQUE_MODEL: gemini-2.5-pro
        run: npm run ui-critique:critique

      - name: Upload critique + screenshots as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-critique-${{ github.run_number }}
          path: e2e/screenshots/
          retention-days: 90
